name: Release

# 打 tag（v1.6.1）自动构建双平台产物并创建 GitHub Release 草稿；也可手动触发只做构建（不建 Release）
# 草稿不会出现在 /releases/latest 与公开列表中，客户端 update 检查因此不受影响，确认无误后手动发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 不并发，避免两个 job 同时写 Release 资产
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI 在海外，走 GitHub 官方源（脚本默认 npmmirror，国内本地构建更快）
  AIROUTE_ELECTRON_SOURCE: official
  # 无证书构建：ad-hoc 签名由 electron-builder.json 的 identity: "-" 显式指定，禁止自动发现证书
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  test:
    name: 测试与版本校验
    runs-on: ubuntu-latest
    steps:
      # 不再需要子模块：渠道实现已是仓库内源码，verify-channels.js 校验
      # 「实现文件 + 面板/CLI/源名清单」是否自洽，不读上游 pack.js。
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 测试全部离线、不依赖 electron 二进制，跳过安装脚本来省掉 ~100MB 下载
      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 单元测试（WorkBuddy 模块）
        run: npm test

      - name: 端到端冒烟测试
        run: npm run test:e2e

      # tag 与 package.json 版本必须对得上，否则产物版本与 Release 不符。
      # 允许带后缀（v1.7.0-beta.1 预发布、v1.6.1-macos.1 这类制品标记）
      - name: 校验 tag 与 package.json 版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          case "$tag" in
            "$pkg" | "$pkg"-*)
              echo "版本一致：${tag}（基线 ${pkg}）"
              ;;
            *)
              echo "::error::tag ${GITHUB_REF_NAME} 与 package.json ${pkg} 不一致"
              exit 1
              ;;
          esac

  build:
    name: 构建 (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # electron-builder.json 里 mac / win 都配了 x64 + arm64，一个 job 出全部架构：
          # macOS runner 是 arm64，交叉打 x64 dmg 没问题；Windows runner 是 x64，同样能交叉打 arm64
          - os: macos-14
            platform: mac
            buildArg: --mac
          - os: windows-latest
            platform: win
            buildArg: --win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # .npmrc 里的 electron_mirror 优先级高于 ELECTRON_MIRROR 环境变量，先清掉才走官方源
      - name: 移除国内镜像配置
        shell: bash
        run: npm config delete electron_mirror --location=project || true

      - name: 缓存 electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      # 打包 + 版本自检（asar / 平台元数据 / ad-hoc 签名 / dmg 体积）都在 build.js 内完成
      - name: 打包
        run: npm run build -- ${{ matrix.buildArg }}

      # 复用发布前检查：asar、平台元数据、CHANGELOG 顶部版本、产物体积与 SHA256
      - name: 发布前检查
        run: node scripts/verify-release.js

      - name: 收集产物
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          # 一次出两个架构，Windows 每个架构两类产物（命名见 electron-builder.json）：
          #   AiRoute-<版本>-{x64,arm64}-setup.exe（安装版，支持一键升级）
          #   AiRoute-<版本>-{x64,arm64}-portable.exe（便携版，不支持一键升级）
          # macOS：AiRoute-<版本>-{arm64,x64}.dmg
          if [ "${{ matrix.platform }}" = "mac" ]; then
            cp "app/release/AiRoute-${version}-"*.dmg dist-assets/
          else
            cp "app/release/AiRoute-${version}-"*.exe dist-assets/
          fi
          ls -lh dist-assets

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: dist-assets/*
          if-no-files-found: error

  release:
    name: 创建草案 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # gh 需要 git 上下文才能推断仓库，否则报 "failed to run git: not a git repository"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      # 旧客户端（≤ v1.8.1）应用内更新只会拼 AiRoute-<版本>-<架构>.exe 与 AiRoute.exe：
      # 前者已改名为 -portable.exe，这里用 x64 便携版生成旧名副本兜底（arm64 旧客户端会回落到它，
      # Windows on ARM 可模拟运行 x64 包）。≤ v1.7.0-beta.1 的客户端把文件名写死成 AiRoute.exe，同一份即可满足。
      # 确认没有旧客户端再拉这个文件后可以删掉这一步
      - name: 生成旧命名的兼容副本
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -f "dist-assets/AiRoute-${version}-x64-portable.exe" ]; then
            cp "dist-assets/AiRoute-${version}-x64-portable.exe" dist-assets/AiRoute.exe
            ls -lh dist-assets
          else
            echo "::warning::未找到 AiRoute-${version}-x64-portable.exe，跳过 AiRoute.exe 兼容副本"
          fi

      - name: 生成 SHA256 校验文件
        run: |
          cd dist-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 产物进草稿 Release：不自动发布，人工确认后再点 Publish。
      # 草稿也能按 tag 查到（gh 的 draft 查找走 GraphQL），重跑 workflow 时走覆盖上传，避免 422。
      # 两条线路的发布方式不同：
      #   正式版（tag 无后缀）仍建草稿，人工核对资产与 SHA256 后再 Publish——它是所有人的默认更新源
      #   beta 版（tag 带 -beta.x 这类后缀）直接发布为 pre-release：它只被 beta 线看到，
      #   而 beta 客户端只会认「已发布」的 Release（草稿在 GitHub 上对匿名调用完全不可见，
      #   资产下载一律 404），留成草稿等于 beta 线永远收不到更新
      - name: 创建 Release（正式版草稿 / beta 直接发 pre-release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; else prerelease=""; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-assets/* --clobber
            [ -n "$prerelease" ] && gh release edit "$GITHUB_REF_NAME" --prerelease
            true
          elif [ -n "$prerelease" ]; then
            gh release create "$GITHUB_REF_NAME" dist-assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist-assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --draft
          fi

      - name: 提示后续动作
        run: |
          {
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              echo "### beta Release 已发布（pre-release）"
              echo
              echo "- tag：\`$GITHUB_REF_NAME\`"
              echo "- beta 线客户端（版本号带 \`-beta\`）现在就能查到它"
              echo "- 它不会进 \`/releases/latest\`，正式线客户端看不到"
            else
              echo "### 草稿 Release 已就绪，等你发布"
              echo
              echo "- tag：\`$GITHUB_REF_NAME\`"
              echo "- 入口：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
              echo "- 草稿不会出现在 \`/releases/latest\`，发布后正式线客户端才会检测到新版本"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

